name: Update Profile Stats

on:
  schedule:
    - cron: "0 3 * * *"   # once a day at 03:00 UTC
  push:
    paths:
      - ".github/workflows/stats.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&hide_border=true&bg_color=0f0c29&title_color=7EB8F7&icon_color=a78bfa&text_color=c7d2fe"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&hide_border=true&bg_color=0f0c29&title_color=7EB8F7&text_color=c7d2fe"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: "user=${{ github.repository_owner }}&hide_border=true&background=0f0c29&ring=7EB8F7&fire=a78bfa&currStreakLabel=7EB8F7&sideNums=c7d2fe&currStreakNum=ffffff&sideLabels=c7d2fe"
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update profile stats cards" || exit 0
          git push
