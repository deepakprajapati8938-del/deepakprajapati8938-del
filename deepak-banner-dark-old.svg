<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="45%" stop-color="#1b1450"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7EB8F7"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7EB8F7"/>
      <animate attributeName="x1" values="-20%;120%;-20%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="80%;220%;80%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7EB8F7" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#7EB8F7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bgGrad)"/>
  <circle cx="170" cy="65" r="140" fill="url(#glow)"/>
  <circle cx="1040" cy="215" r="160" fill="url(#glow)"/>

  <circle cx="90" cy="40" r="3" fill="#7EB8F7"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="1120" cy="60" r="2.5" fill="#a78bfa"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="150" cy="235" r="2" fill="#c7d2fe"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="1080" cy="180" r="3" fill="#7EB8F7"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/></circle>
  <circle cx="60" cy="150" r="2" fill="#a78bfa"><animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="1000" cy="50" r="2" fill="#c7d2fe"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite"/></circle>

  <text x="70" y="150" font-family="Consolas, monospace" font-size="80" fill="#ffffff" opacity="0.06" font-weight="700">&lt;/&gt;</text>
  <text x="985" y="250" font-family="Consolas, monospace" font-size="60" fill="#ffffff" opacity="0.06" font-weight="700">{ }</text>

