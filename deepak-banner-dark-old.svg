  <text x="600" y="172" font-family="Consolas, monospace" font-size="18" fill="#c7d2fe" text-anchor="middle" opacity="0.95">Full Stack Developer • GenAI Developer • Open Source Contributor</text>

  <path d="M0,230 C200,270 350,200 600,225 C850,250 1000,190 1200,225 L1200,280 L0,280 Z" fill="#ffffff" opacity="0.05"/>
  <path d="M0,245 C220,285 380,215 600,240 C820,265 980,205 1200,240 L1200,280 L0,280 Z" fill="#ffffff" opacity="0.08"/>
</svg>
